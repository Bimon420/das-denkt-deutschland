<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 154 120" role="img" aria-label="DDD — Das Denkt Deutschland">
  <!-- Fassung für dunkle Gründe: Geometrie wie ddd_marke.svg, aber die Fugen (6) sind ausgeschnitten
       statt weiß gemalt, damit der Grund durchscheint (kein weißer Aufkleber-Rand). Innenräume bleiben weiß. -->
  <defs>
    <path id="a" d="M0 0 H34 A44 56 0 0 1 34 112 H0 Z"/>
    <path id="i" d="M22 24 H34 A24 32 0 0 1 34 88 H22 Z"/>
    <mask id="mg" maskUnits="userSpaceOnUse" x="-10" y="-10" width="170" height="135">
      <rect x="-10" y="-10" width="170" height="135" fill="#fff"/>
      <use href="#a" transform="translate(32 0)" fill="#000" stroke="#000" stroke-width="6"/>
      <use href="#a" fill="#000" stroke="#000" stroke-width="6"/>
    </mask>
    <mask id="mr" maskUnits="userSpaceOnUse" x="-10" y="-10" width="170" height="135">
      <rect x="-10" y="-10" width="170" height="135" fill="#fff"/>
      <use href="#a" fill="#000" stroke="#000" stroke-width="6"/>
    </mask>
  </defs>
  <g mask="url(#mg)"><g transform="translate(64 0)"><use href="#a" fill="#FFCC00"/><use href="#i" fill="#FFFFFF"/></g></g>
  <g mask="url(#mr)"><g transform="translate(32 0)"><use href="#a" fill="#DD0000"/><use href="#i" fill="#FFFFFF"/></g></g>
  <g><use href="#a" fill="#000000"/><use href="#i" fill="#FFFFFF"/></g>
</svg>
