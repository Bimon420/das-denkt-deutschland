<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 154 120" role="img" aria-label="DDD — Das Denkt Deutschland">
  <!-- Drei D hintereinander, Flaggenfolge von vorn nach hinten: Schwarz, Rot, Gold.
       Jedes D ist deckend (Innenraum weiß gefüllt), damit kein Stamm durch den Bogen davor scheint.
       Die weiße Fuge (stroke) trennt die Ebenen auch noch bei 16 px. -->
  <defs>
    <path id="aussen" d="M0 0 H34 A44 56 0 0 1 34 112 H0 Z"/>
    <path id="innen" d="M22 24 H34 A24 32 0 0 1 34 88 H22 Z"/>
  </defs>
  <g transform="translate(64 0)"><use href="#aussen" fill="#FFCC00" stroke="#FFFFFF" stroke-width="6" paint-order="stroke"/><use href="#innen" fill="#FFFFFF"/></g>
  <g transform="translate(32 0)"><use href="#aussen" fill="#DD0000" stroke="#FFFFFF" stroke-width="6" paint-order="stroke"/><use href="#innen" fill="#FFFFFF"/></g>
  <g><use href="#aussen" fill="#000000" stroke="#FFFFFF" stroke-width="6" paint-order="stroke"/><use href="#innen" fill="#FFFFFF"/></g>
</svg>
