    <mask id="mg" maskUnits="userSpaceOnUse" x="-10" y="-10" width="170" height="135"><rect x="-10" y="-10" width="170" height="135" fill="#fff"/><use href="#loch" fill="#000" stroke="#000" stroke-width="6"/><use href="#loch" transform="translate(32 0)" fill="#000" stroke="#000" stroke-width="6"/></mask>
  </defs>
  <g mask="url(#mg)"><use href="#d" transform="translate(64 0)" fill="#FFCC00" stroke="#FFFFFF" stroke-width="6" paint-order="stroke"/></g>
