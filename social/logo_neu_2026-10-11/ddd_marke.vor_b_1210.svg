<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 154 120" role="img" aria-label="DDD — Das Denkt Deutschland">
  <!-- Drei D hintereinander, Flaggenfolge von vorn nach hinten: Schwarz, Rot, Gold.
       Seit 12.10.2026 (Simon: „wieso nicht weiße Ränder für jeden Buchstaben?" → „nimm das Muster"):
       jedes D ist ein echter Buchstabe mit Loch (evenodd) und hat einen weißen Rand (6) außen UND innen;
       durch das Loch sieht man das D dahinter. Vorher weiß gefüllte Innenräume: ddd_marke.vor_raender_1210.svg -->
  <defs>
    <path id="d" fill-rule="evenodd" d="M0 0 H34 A44 56 0 0 1 34 112 H0 Z M22 24 V88 H34 A24 32 0 0 0 34 24 Z"/>
  </defs>
  <use href="#d" transform="translate(64 0)" fill="#FFCC00" stroke="#FFFFFF" stroke-width="6" paint-order="stroke"/>
  <use href="#d" transform="translate(32 0)" fill="#DD0000" stroke="#FFFFFF" stroke-width="6" paint-order="stroke"/>
  <use href="#d" fill="#000000" stroke="#FFFFFF" stroke-width="6" paint-order="stroke"/>
</svg>
