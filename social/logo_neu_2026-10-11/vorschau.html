<!doctype html><html lang="de"><head><meta charset="utf-8"><title>DDD Logo Muster</title>
<style>
body{margin:0;font:15px system-ui,sans-serif;background:#f4f4f2;color:#111}
.blatt{display:grid;grid-template-columns:1fr 1fr;gap:0;width:1200px}
.feld{padding:36px;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.hell{background:#ffffff}.dunkel{background:#16181b;color:#eee}
.marke img{height:180px}
.wort{display:flex;align-items:center;gap:18px}
.wort img{height:64px}
.wort span{font:700 30px/1.05 Georgia,"Times New Roman",serif;letter-spacing:.01em}
.wort small{display:block;font:500 13px system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.65;margin-top:6px}
.icons{display:flex;gap:26px;align-items:flex-end}
.tab{display:flex;align-items:center;gap:8px;background:#dfe1e5;border-radius:8px 8px 0 0;padding:7px 14px;font-size:13px;color:#222}
.dunkel .tab{background:#35363a;color:#ddd}
.kachel{background:#fff;border-radius:22%;display:flex;align-items:center;justify-content:center}
.lbl{font-size:12px;opacity:.6}
</style></head><body><div class="blatt">
<div class="feld hell">
  <div class="marke"><img src="ddd_marke.svg" alt="DDD"></div>
  <div class="wort"><img src="ddd_marke.svg" alt=""><span>Das Denkt<br>Deutschland<small>DDD</small></span></div>
  <div class="icons">
    <div><div class="kachel" style="width:64px;height:64px"><img src="ddd_marke.svg" style="width:52px"></div><div class="lbl">App 64</div></div>
    <div><img src="ddd_marke.svg" style="width:32px"><div class="lbl">32 px</div></div>
    <div><img src="ddd_marke.svg" style="width:16px"><div class="lbl">16 px</div></div>
    <div class="tab"><img src="ddd_marke.svg" style="width:16px">DDD — Das Denkt Deutschland</div>
  </div>
</div>
<div class="feld dunkel">
  <div class="marke"><img src="ddd_marke.svg" alt="DDD"></div>
  <div class="wort"><img src="ddd_marke.svg" alt=""><span>Das Denkt<br>Deutschland<small>DDD</small></span></div>
  <div class="icons">
    <div><div class="kachel" style="width:64px;height:64px"><img src="ddd_marke.svg" style="width:52px"></div><div class="lbl">App 64</div></div>
    <div><img src="ddd_marke.svg" style="width:32px"><div class="lbl">32 px</div></div>
    <div><img src="ddd_marke.svg" style="width:16px"><div class="lbl">16 px</div></div>
    <div class="tab"><img src="ddd_marke.svg" style="width:16px">DDD — Das Denkt Deutschland</div>
  </div>
</div>
</div></body></html>
